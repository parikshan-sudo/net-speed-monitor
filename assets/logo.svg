<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24283b" />
      <stop offset="100%" stop-color="#16161e" />
    </linearGradient>

    <!-- Outer Border / Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#414868" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0.4" />
    </linearGradient>

    <!-- Speedometer Dial Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3584e4" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#33d17a" />
    </linearGradient>

    <!-- Download Arrow Gradient -->
    <linearGradient id="dlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26a269" />
      <stop offset="100%" stop-color="#57e389" />
    </linearGradient>

    <!-- Upload Arrow Gradient -->
    <linearGradient id="ulGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1c71d8" />
      <stop offset="100%" stop-color="#62a0ea" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle (GNOME HIG Style) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#dropShadow)" />

  <!-- Speedometer Track (Background Arc) -->
  <path d="M 32 86 A 40 40 0 1 1 96 86" fill="none" stroke="#2c3045" stroke-width="8" stroke-linecap="round" />

  <!-- Speedometer Dynamic Active Arc -->
  <path d="M 32 86 A 40 40 0 1 1 88 50" fill="none" stroke="url(#arcGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Tick Marks -->
  <line x1="64" y1="28" x2="64" y2="34" stroke="#7aa2f7" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="36" x2="46" y2="41" stroke="#565f89" stroke-width="2" stroke-linecap="round" />
  <line x1="86" y1="36" x2="82" y2="41" stroke="#565f89" stroke-width="2" stroke-linecap="round" />

  <!-- Network Traffic Arrows Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Download Arrow (Green) -->
    <path d="M 49 52 L 49 70 L 40 70 L 52 86 L 64 70 L 55 70 L 55 52 Z" fill="url(#dlGrad)" />
    
    <!-- Upload Arrow (Blue) -->
    <path d="M 75 50 L 63 66 L 72 66 L 72 84 L 78 84 L 78 66 L 87 66 Z" fill="url(#ulGrad)" />
  </g>

  <!-- Activity Pulse Point -->
  <circle cx="64" cy="98" r="3.5" fill="#00d2ff" />
  <circle cx="64" cy="98" r="6" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
