name: Bug Report
description: Report a reproducible bug or issue with Net Speed Monitor
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: os_version
    attributes:
      label: Operating System & Version
      placeholder: "e.g., Ubuntu 26.04, Fedora 42, Arch Linux"
    validations:
      required: true
  - type: input
    id: gnome_version
    attributes:
      label: GNOME Shell Version
      placeholder: "e.g., 50.1, 47.0 (run: gnome-shell --version)"
    validations:
      required: true
  - type: dropdown
    id: session_type
    attributes:
      label: Session Type
      options:
        - Wayland
        - X11
    validations:
      required: true
  - type: textarea
    id: bug_description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open dashboard popup...
        2. Click on...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant System Logs
      description: Run `journalctl /usr/bin/gnome-shell -f -o cat` or check GNOME Shell journal.
      render: shell
