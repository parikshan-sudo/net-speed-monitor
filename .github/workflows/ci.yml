name: CI & Packaging

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin zip gettext

      - name: Validate GSettings XML Schema
        run: |
          glib-compile-schemas --strict schemas/

      - name: Validate metadata.json
        run: |
          python3 -c "
          import json, re
          with open('metadata.json') as f:
              m = json.load(f)
          assert m.get('name') and isinstance(m['name'], str), 'Missing name'
          assert m.get('description') and isinstance(m['description'], str), 'Missing description'
          assert m.get('uuid') == 'net-speed-monitor@pnr.tech', 'Invalid UUID'
          assert isinstance(m.get('shell-version'), list) and len(m['shell-version']) > 0, 'Missing shell-version'
          assert m.get('url') and re.match(r'^https?://', m['url']), 'Missing or invalid url'
          assert m.get('settings-schema'), 'Missing settings-schema'
          print('metadata.json conforms to EGO requirements!')
          "

      - name: Build Distribution Zip
        run: |
          bash package.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-speed-monitor-extension
          path: dist/*.zip
